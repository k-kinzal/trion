[package]
name = "trion-cli"
version.workspace = true
edition.workspace = true
description = "The trion command, which converts a package into its MMT form and its documents, and the trioc command, which proves the obligations of that form."

[lib]
name = "trion_cli"
path = "src/lib.rs"

[[bin]]
name = "trion"
path = "src/main.rs"

[[bin]]
name = "trioc"
path = "src/bin/trioc.rs"

[dependencies]
trion-language.workspace = true
trion-solver.workspace = true
trion-verification.workspace = true
trion-checker.workspace = true
trioc-cli.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
toml.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true

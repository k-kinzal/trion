[package]
name = "trion-cli"
version.workspace = true
edition.workspace = true
description = "The trion command: verifies a package, writes it as a document and serves editors."

[lib]
name = "trion_cli"
path = "src/lib.rs"

[[bin]]
name = "trion"
path = "src/main.rs"

[dependencies]
trion-language.workspace = true
trion-solver.workspace = true
trion-verification.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
toml.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true

id = "A04"
title = "Two completions of one activation cannot each come before the other"
work = "W06"
status = "closed"
args = ["verify", "--json"]
reason = """
Both statements have the trigger `the timer expires`, so one expiry activates both. [A] requires the
completion of `log the request` that answers this expiry to be strictly before the completion of
`send the report` that answers it; [B] requires the reverse. `before` is a strict order, so the
situation in which the timer expires has no response. A trace abstraction in which the two completions
lie in an unordered tail is no model of the statements: it must be made concrete or dropped.
"""

[expect]
verified = false
blockers = ["contradiction"]

[expect.claims]
situation_total = "refuted"


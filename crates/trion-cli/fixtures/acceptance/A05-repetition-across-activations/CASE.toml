id = "A05"
title = "Opposite orders in activations that the environment can make coincide"
work = "W06"
status = "closed"
args = ["--json"]
reason = """
[A] orders the two completions that answer an expiry of the timer, and [B] orders the two that answer
a ring of the bell. Where the expiry and the ring come at different moments, a behaviour logs and then
sends after the expiry, and sends and then logs after the ring: the same actions in two activations may
alternate, and the names of the actions forming a cycle is no contradiction.

The environment decides both triggers, and nothing says that they never come at the same moment.
Where they do, both activations open at one moment t, and an occurrence after t belongs to both
(spec/semantics/core.md, section 4): [A] needs a log after t with no sending at or before it, [B] a
sending after t with no log at or before it, and whichever comes first breaks the other statement. A
system that accepts every input cannot avoid that situation, so the package is inconsistent, and the
counterexample names the two triggers at one moment.

Until the conversion to MMT this case was verified: the old engine let the system avoid the situation.
"""

[expect]
verified = false
diagnostics = ["contradiction"]

[expect.obligations]
consistency = "refuted"

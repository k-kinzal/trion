id = "A23"
title = "A property that follows from premises without a model is not proved"
work = "W02"
status = "closed"
args = ["--json"]
reason = """
The premises of the check say that each guest is a member, that no guest is one and that some guest
is one: they have no model, and every property follows from them. Reporting the check as proved would
say that a specification that can be kept has the property. The obligation of the check first asks
that its premises have a model, and that part is refuted, so the check is refuted.
"""

[expect]
verified = false
diagnostics = ["check-refuted"]

[expect.obligations]
"check/SAME" = "refuted"

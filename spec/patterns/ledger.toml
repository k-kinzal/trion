]
claims = ["property_entails"]
open = [
    "W02: a check without a relation or without a side stays among the outcomes with `result: \"invalid\"`, one that names a missing statement is `invalid`, and one whose operand has no formal interpretation is `unsupported` (blocks.rs:run_checks); at 24cab2aa the first was `proved` and the others vanished",
    "W02 (closed 2026-11-13): a check with a relation other than `equivalent`, with an unknown field or without `using definitions` reported `parse-check` and was still decided as an equivalence and listed as `proved`; the parser now marks the block (`Check.malformed`) and its outcome is `invalid` (draft_rules.rs::an_unsupported_or_unresolved_construct_prevents_success)",
    "W02: only `equivalent` is accepted; the environment adds 'each mentioned closed attribute holds one of its values at each moment', a premise the consistency search does not use",
    "W02: an inconsistent environment is reported as unknown; a proof needs the nearest axioms only, a refutation every axiom that reaches the operands",
]
acceptance = ["A20", "A23"]


# The pattern ledger of trion: syntax x meaning, first edition (work item W01).
#
# One [[pattern]] table for each surface pattern that the parser accepts or
# deliberately rejects. The ledger records what the implementation does; it
# does not say that the reading is right. `spec/semantics/README.md` explains
# the classification and lists every unresolved entry and open question.
#
# The entries describe the working tree of 2026-11-13; where it differs from
# the baseline 24cab2aa, `open` or `note` says what the baseline did.
#
# Keys
#   id          the rule name of `reading/rules.rs` where one exists; `doc-` for a
#               construct of `document.rs`; `rej-` for a form that the parser or the
#               reading rejects; `variant-` for a surface distinction that rules.rs
#               reports under a broader rule (`rule` names it) but that is lowered
#               or classified differently
#   group       the row of the table in plan section 3
#   surface     one to three surface forms
#   parser      where the form is recognised, "file:function"
#   parse       accepted | rejected | partial
#   meaning     rule | nonnormative | unresolved | rejected
#   lowering    where the meaning is produced, "file:function"; "" when none
#   evidence    tests with an assertion about the meaning of the form,
#               "path::test_fn"; empty when none was found
#   claims      the claims of plan section 6.1 that the construct influences through
#               its reading today; empty for a construct whose reading is absent
#   open        undecided semantic questions, each with the work item that owns it
#   acceptance  the acceptance examples that involve the pattern: A01-A23 of plan
#               section 15, with a letter for a split case (A03b, A06a), as in
#               crates/trion-cli/fixtures/acceptance/<ID>-<name>/CASE.toml

[[pattern]]
id = "obligation"
group = "modality"
surface = ["The API shall log the call.", "The API must log the call."]
parser = "crates/trion-language/src/syntax/parse.rs:parse_deontic"
parse = "accepted"
meaning = "rule"
lowering = "crates/trion-language/src/reading/model.rs:action_formula; crates/trion-language/src/reading/model.rs:item_formula"
evidence = [
    "crates/trion-verification/tests/contradiction.rs::an_obligation_contradicts_a_prohibition",
    "crates/trion-verification/tests/solver.rs::modal_force_maps_to_formulas",
    "crates/trion-verification/tests/contradiction.rs::an_obligation_implies_its_plain_action",
    "crates/trion-cli/tests/temporal_rules.rs::an_activated_positive_action_completes_eventually",
    "crates/trion-cli/tests/draft_rules.rs::each_speech_act_has_its_own_meaning",
]
claims = ["contract_sat", "situation_total", "property_entails"]
open = [
    "W03: the contract is Act(k) and not Forbid(k) and not Discouraged(k) over one representative; actor and object identity is the string key k",
    "W06: without a trigger an action obligation applies to 'each invocation' of its verb, declared or not; an undeclared operation has no activation boundary",
    "W06: 'eventually complete' is met in the rest of the trace; a finite trace never refutes it",
]
acceptance = ["A07", "A13", "A21"]

